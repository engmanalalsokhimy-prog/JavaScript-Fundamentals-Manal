
<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Fundamentals Eng.Aymen</title>
    <meta charset="UTF-8">
</head>
<body>

    <h1>JavaScript Fundamentals</h1>
    <h2>إعداد الطالبة: منال</h2>

    <h2>Using innerHTML</h2>

    <h1>My First Web Page</h1>
    <p>My First Paragraph</p>
    <p id="demo1"></p>

    <script>
        document.getElementById("demo1").innerHTML = "<h2>Hello Manal</h2>";
    </script>

    <hr>

    <h2>Using innerText</h2>

    <h1>My First Web Page</h1>
    <p>My First Paragraph</p>
    <p id="demo2"></p>

    <script>
        document.getElementById("demo2").innerText = "Hello World";
    </script>

    <hr>

    <h2>Using document.write()</h2>

    <h1>My First Web Page</h1>
    <p>My first paragraph.</p>

    <button type="button" onclick="document.write(5 + 6)">Try it</button>

    <hr>

    <h2>Using window.alert()</h2>

    <button onclick="window.alert(5 + 6)">Show Alert</button>

    <hr>

    <h2>Console.log()</h2>

    <script>
        console.log("Hello,students");
    </script>

    <hr>

    <h2>JavaScript Print</h2>

    <button onclick="window.print()">Print this page</button>

</body>
</html>
